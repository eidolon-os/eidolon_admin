# LiveKit server — local / LAN dev (shared infra for hub + channel).
#
# Owned by eidolon_admin; started via deploy/supervisor/available/livekit.conf.
# Keys here must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in hub and channel
# config/.env.

port: 7880
bind_addresses:
  - 0.0.0.0

keys:
  eidolon: _v0_i6cC2NJqa-4a6b-TfmtdJ9giW3WRu9QQRYSXUQ0

# No cert_file/key_file → TURN TLS off; UDP/TCP only.
turn:
  enabled: true
  udp_port: 3478

rtc:
  port_range_start: 50000
  port_range_end: 60000

logging:
  level: debug
  json: false
