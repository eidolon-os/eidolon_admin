; supervisord master config for the Eidolon dev stack.
;
; This single supervisord daemon manages every sub-project that the admin
; gateway is wired to monitor (memory now, hub/agent later). The admin gateway
; talks to it over the unix socket below via XML-RPC.
;
; Enable / disable a sub-project = create / remove a symlink under
;   deploy/supervisor/enabled/<name>.conf -> ../available/<name>.conf
; The [include] glob below picks up whatever lives in enabled/.
;
; Start/stop ordering is encoded with [group:*] priority values in each
; available/*.conf. Lower priority groups are spawned first and stopped last,
; so infrastructure should use low numbers and leaf apps should use higher
; numbers.

[unix_http_server]
file=%(here)s/../../var/supervisor.sock
chmod=0700

[supervisord]
; Logs live under ~/eidolon/logs/<project>/. supervisord's own event log
; (program start/stop/backoff) belongs to the admin namespace.
logfile=%(ENV_HOME)s/eidolon/logs/admin/supervisord.log
; Runtime artifacts (pid, socket) stay repo-local under var/ — they're not
; logs and need to be co-located with the supervisord.conf they describe.
pidfile=%(here)s/../../var/supervisord.pid
childlogdir=%(ENV_HOME)s/eidolon/logs/admin/childlogs
nodaemon=false
minfds=1024
minprocs=200
; Scrub HTTP proxy env vars from supervisord and every child it spawns.
; The whole Eidolon dev stack speaks only to localhost (NATS, LiveKit, hub,
; memory, channel — all 127.0.0.1). When the operator's shell has Clash /
; mitmproxy / similar exported globally (HTTP_PROXY=http://127.0.0.1:7890),
; libraries that don't respect NO_PROXY (notably aiohttp.ws_connect for
; ws:// URLs) silently route via the proxy and the upstream tears the
; connection down. Empty values here override anything inherited from the
; launching shell for ALL [program:*] entries.
environment=HTTP_PROXY="",HTTPS_PROXY="",ALL_PROXY="",http_proxy="",https_proxy="",all_proxy=""

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../../var/supervisor.sock

[include]
files=%(here)s/../supervisor/enabled/*.conf
