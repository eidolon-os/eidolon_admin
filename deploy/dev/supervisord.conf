; supervisord master config for the Eidolon dev stack.
;
; This single supervisord daemon manages every sub-project that the admin
; gateway is wired to monitor (memory now, hub/agent later). The admin gateway
; talks to it over the unix socket below via XML-RPC.
;
; Enable / disable a sub-project = create / remove a symlink under
;   deploy/supervisor/enabled/<name>.conf -> ../available/<name>.conf
; The [include] glob below picks up whatever lives in enabled/.

[unix_http_server]
file=%(here)s/../../var/supervisor.sock
chmod=0700

[supervisord]
; Logs live under ~/eidolon/logs/<project>/. supervisord's own event log
; (program start/stop/backoff) belongs to the admin namespace.
logfile=%(ENV_HOME)s/eidolon/logs/admin/supervisord.log
; Runtime artifacts (pid, socket) stay repo-local under var/ — they're not
; logs and need to be co-located with the supervisord.conf they describe.
pidfile=%(here)s/../../var/supervisord.pid
childlogdir=%(ENV_HOME)s/eidolon/logs/admin/childlogs
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../../var/supervisor.sock

[include]
files=%(here)s/../supervisor/enabled/*.conf
