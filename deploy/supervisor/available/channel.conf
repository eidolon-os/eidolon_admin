; eidolon_channel — LiveKit voice agent worker.
;
; No HTTP / NATS surface from the worker itself. supervisord owns lifecycle;
; we surface status / logs through the admin UI's Supervisor + channel pages.
;
; The project ships its env in deploy/.livekit-channel.env (gitignored, copied
; from livekit-channel.env.template). We point EIDOLON_CHANNEL_LIVEKIT_ENV at
; that file AND also source it so any var the worker reads through os.environ
; (e.g. AGENT_MODE, STT_PROVIDER) is available.

[program:channel-worker]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_channel
    deploy/.livekit-channel.env
    --
    /Users/manson/ai/eidolon/eidolon_channel/.venv/bin/python
    -m
    eidolon.livekit.agent.server
directory=/Users/manson/ai/eidolon/eidolon_channel
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=40
stdout_logfile=%(ENV_HOME)s/eidolon/logs/channel/worker.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/channel/worker.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",EIDOLON_CHANNEL_LIVEKIT_ENV="/Users/manson/ai/eidolon/eidolon_channel/deploy/.livekit-channel.env",EIDOLON_ENV="dev"

[group:channel]
programs=channel-worker
