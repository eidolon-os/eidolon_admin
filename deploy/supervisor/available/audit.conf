; Global audit query projection.
;
; This is infrastructure, not a business authority. Producers commit only to
; their local outbox and publish asynchronously to the dedicated JetStream
; stream. This worker is the sole writer of audit-index.sqlite3, so indexing
; and Mission Control query load never contend with a business SQLite writer.

[program:audit-indexer]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/wait-tcp.sh
    --host
    127.0.0.1
    --port
    4222
    --timeout
    60
    --
    /Users/manson/ai/eidolon/eidolon_admin/.venv/bin/python
    -m
    eidolon_admin_server.audit.cli
    --nats-url
    nats://127.0.0.1:4222
    --sqlite-path
    %(ENV_HOME)s/eidolon/data/audit-index.sqlite3
directory=/Users/manson/ai/eidolon/eidolon_admin
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/eidolon/logs/audit/indexer.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/audit/indexer.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:audit]
priority=20
programs=audit-indexer
