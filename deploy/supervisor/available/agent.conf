; eidolon_agent — single binary spawns gRPC (:45051), HTTP (:8180), Admin (:8081).
;
; The `eidolon-agent` console script is the entire process; lifecycle is managed
; via supervisord (autorestart on crash). We source the project's .env if
; present in case settings YAML path or NATS creds live there.

[program:agent]
; with-env.sh → wait-tcp gate → eidolon-agent.
; Phase 30.A: agent's settings.py default is nats://127.0.0.1:4222.
; Without the gate, a cold start could see agent dial NATS before
; nats-server bound the socket, log a connection error storm, and
; (depending on agent's own retry policy) either crash-restart or
; serve degraded. Same wrapper chain as memory/channel.
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_agent
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/wait-tcp.sh
    --host
    127.0.0.1
    --port
    4222
    --timeout
    60
    --
    /Users/manson/ai/eidolon/eidolon_agent/.venv/bin/eidolon-agent
directory=/Users/manson/ai/eidolon/eidolon_agent
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=35
stdout_logfile=%(ENV_HOME)s/eidolon/logs/agent/main.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/agent/main.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:agent]
priority=140
programs=agent
