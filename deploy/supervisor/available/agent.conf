; eidolon_agent — single binary spawns gRPC (:45051), HTTP (:8180), Admin (:8081).
;
; The `eidolon-agent` console script is the entire process; lifecycle is managed
; via supervisord (autorestart on crash). We source the project's .env if
; present in case settings YAML path or NATS creds live there.

[program:agent]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_agent
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_agent/.venv/bin/eidolon-agent
directory=/Users/manson/ai/eidolon/eidolon_agent
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=35
stdout_logfile=%(ENV_HOME)s/eidolon/logs/agent/main.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/agent/main.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:agent]
priority=140
programs=agent
