; eidolon_memory — two long-running processes.
;
; memory-supervisor: the in-process supervisor that spawns one agent_runner
;   subprocess per enabled user in users.yaml. We leave its children alone:
;   stopwaitsecs is large enough (35s) to cover the 30s grace the internal
;   supervisor gives each agent_runner before its own SIGKILL.
;
; memory-discovery: HTTP service; port from config/ports.yaml.

[program:memory-supervisor]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_memory
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_memory/.venv/bin/eidolon-memory-supervisor
directory=/Users/manson/ai/eidolon/eidolon_memory
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=35
stdout_logfile=%(ENV_HOME)s/eidolon/logs/memory/supervisor.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/memory/supervisor.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; PATH must include memory's venv so the in-process supervisor can spawn
; `eidolon-memory-agent` children by bare command name (it uses
; subprocess.Popen(['eidolon-memory-agent', ...]) without an absolute path).
; EIDOLON_MEMORY_LOG_DIR puts memory-supervisor's agent_runner children's
; logs under our standard layout (~/eidolon/logs/memory/) instead of dumping
; agent_<user_id>.log at the top level.
environment=PYTHONUNBUFFERED="1",PATH="/Users/manson/ai/eidolon/eidolon_memory/.venv/bin:%(ENV_PATH)s",EIDOLON_MEMORY_LOG_DIR="%(ENV_HOME)s/eidolon/logs/memory"

[program:memory-discovery]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_memory
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_memory/.venv/bin/eidolon-memory-discovery
    --host
    %(ENV_EIDOLON_MEMORY_DISCOVERY_HOST)s
    --port
    %(ENV_EIDOLON_MEMORY_DISCOVERY_PORT)s
directory=/Users/manson/ai/eidolon/eidolon_memory
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/eidolon/logs/memory/discovery.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/memory/discovery.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:memory]
programs=memory-supervisor,memory-discovery
