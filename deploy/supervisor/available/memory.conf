; eidolon_memory — two long-running supervisord programs.
;
; memory-supervisor: in-process supervisor that spawns per-user children from
;   users.yaml — one eidolon-memory-agent per enabled user, and optionally
;   eidolon-memory-consolidator when consolidator.enabled is true (opt-in).
;   Child logs: ~/eidolon/logs/memory/agent_<user>.log and
;   consolidator_<user>.log (EIDOLON_MEMORY_LOG_DIR). Do not add a separate
;   supervisord program for consolidator; SIGHUP memory-supervisor reconciles.
;   stopwaitsecs (35s) covers the 30s grace before SIGKILL on agent children.
;
; memory-discovery: HTTP service; port from config/ports.yaml.

[program:memory-supervisor]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_memory
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_memory/.venv/bin/eidolon-memory-supervisor
directory=/Users/manson/ai/eidolon/eidolon_memory
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=35
stdout_logfile=%(ENV_HOME)s/eidolon/logs/memory/supervisor.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/memory/supervisor.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
; PATH must include memory's venv so the in-process supervisor can spawn
; `eidolon-memory-agent` and `eidolon-memory-consolidator` by bare command name.
; EIDOLON_MEMORY_LOG_DIR puts supervisor children's logs under
; ~/eidolon/logs/memory/ ({agent,consolidator}_<user_id>.log).
environment=PYTHONUNBUFFERED="1",PATH="/Users/manson/ai/eidolon/eidolon_memory/.venv/bin:%(ENV_PATH)s",EIDOLON_MEMORY_LOG_DIR="%(ENV_HOME)s/eidolon/logs/memory",EIDOLON_MEMORY_USERS_YAML="%(ENV_EIDOLON_MEMORY_USERS_YAML)s"

[program:memory-discovery]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_memory
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_memory/.venv/bin/eidolon-memory-discovery
    --host
    %(ENV_EIDOLON_MEMORY_DISCOVERY_HOST)s
    --port
    %(ENV_EIDOLON_MEMORY_DISCOVERY_PORT)s
directory=/Users/manson/ai/eidolon/eidolon_memory
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/eidolon/logs/memory/discovery.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/memory/discovery.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:memory]
programs=memory-supervisor,memory-discovery
