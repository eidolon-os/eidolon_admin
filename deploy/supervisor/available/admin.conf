; eidolon_admin — gateway API (the admin we're looking at right now).
;
; The admin api lives in this very venv. We register it as a supervised
; program so:
;   - it auto-restarts on crash
;   - it stops cleanly with the rest of the stack on supervisord shutdown
;   - the Configs page can trigger `restart_program admin:admin-api` to
;     pick up edits to services.yaml without the user dropping to a shell
;
; The admin web (vite :9001) is NOT supervised here — it's a dev tool with
; HMR, file watching, and frequent crash-on-bad-file behaviour that doesn't
; play well with a strict autorestart loop. run_all.sh launches it directly.
;
; Self-restart caveat: when the browser POSTs
;   /api/supervisor/programs/admin:admin-api/restart
; the request is handled by admin-api itself. supervisord SIGTERMs the
; process mid-request, so the POST never returns — the browser sees a
; disconnect. supervisord still completes the stop+start cycle and the
; api comes back. The frontend already tolerates dropped requests during
; supervisor operations.

[program:admin-api]
; wait-tcp gate (Phase 30.A): supervisord's ``priority`` schedules nats
; before admin, but it only honors a 1s startsecs timer — it does NOT
; wait for the NATS port to actually accept connections. On a
; ``run_all.sh restart`` cold start, admin's lifespan tried to connect
; to :4222 before nats-server had bound the socket, hit the 5-attempt
; ceiling, and silently degraded all registry orchestrators to None
; (every /api/{tenants,users,agents,devices,resolve} returned 503 until
; admin was restarted manually). The wait-tcp.sh wrapper polls the
; port with /dev/tcp/4222 + exponential backoff, then exec's uvicorn —
; so supervisord sees one program with the uvicorn PID, lifecycle
; unchanged. 60s timeout is well above NATS's typical 0.3-1s bind
; latency and below a sane "give up" threshold.
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/wait-tcp.sh
    --host
    127.0.0.1
    --port
    4222
    --timeout
    60
    --
    /Users/manson/ai/eidolon/eidolon_admin/.venv/bin/uvicorn
    eidolon_admin_server.app.main:app
    --host %(ENV_EIDOLON_ADMIN_API_HOST)s
    --port %(ENV_EIDOLON_ADMIN_API_PORT)s
directory=/Users/manson/ai/eidolon/eidolon_admin
autostart=true
autorestart=true
; uvicorn opens its listening socket fast; 5s accommodates the wait-tcp
; gate's poll (typically completes in 0.3-2s) plus uvicorn's own boot.
startsecs=5
; Give the api a generous SIGTERM window — it may be mid-flight on an SSE
; tail or a memory write that we don't want to truncate.
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_HOME)s/eidolon/logs/admin/gateway-api.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/admin/gateway-api.err.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1",EIDOLON_ADMIN_API_URL="http://%(ENV_EIDOLON_ADMIN_API_HOST)s:%(ENV_EIDOLON_ADMIN_API_PORT)s",EIDOLON_ADMIN_REGISTRY_DB_PATH="/Users/manson/ai/eidolon/eidolon_admin/var/registry.sqlite3"

[group:admin]
priority=50
programs=admin-api
