; eidolon_hub — FastAPI; listen host/port from config/settings.yaml.
;
; We deliberately do NOT supervise hub's Next.js web client (client/web → :3000)
; nor its legacy Vite admin (client/admin → :5173). Reason: this admin gateway
; provides the UI; those should be retired by hub.
;
; with-env.sh loads config/.env (LIVEKIT_API_KEY/SECRET only); run-hub-api.sh
; reads api.host/api.port from settings.yaml for uvicorn.

[program:hub-api]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/with-env.sh
    /Users/manson/ai/eidolon/eidolon_hub
    config/.env
    --
    /Users/manson/ai/eidolon/eidolon_hub/deploy/dev/run-hub-api.sh
directory=/Users/manson/ai/eidolon/eidolon_hub
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=%(ENV_HOME)s/eidolon/logs/hub/api.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/hub/api.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:hub]
programs=hub-api
