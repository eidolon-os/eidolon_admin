; eidolon_client_web — Next.js dev server (port 3000).
;
; Browser-facing client that connects to hub's LiveKit room and hub's
; /api/config token endpoint. Pure frontend; no admin HTTP / NATS surface.
; supervisord just owns the lifecycle of `next dev`.
;
; Next.js auto-loads .env.local from the project cwd, so no with-env.sh
; wrapper is needed here. We bind explicitly to :3000 (the legacy hub
; client/web also defaulted to :3000, so make sure that one isn't running
; before enabling this conf).

[program:client-web]
command=/Users/manson/ai/eidolon/eidolon_client_web/node_modules/.bin/next
    dev
    --port
    3000
directory=/Users/manson/ai/eidolon/eidolon_client_web
autostart=true
autorestart=true
startsecs=4
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=%(ENV_HOME)s/eidolon/logs/client-web/dev.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/client-web/dev.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=NODE_ENV="development"

[group:client-web]
programs=client-web
