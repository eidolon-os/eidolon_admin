; LiveKit server — shared infrastructure used by hub (room control plane) and
; channel (voice agent worker). Config is owned by this repo (deploy/livekit/).
; The --dev flag uses LiveKit's permissive local-only key/secret pair;
; production deployments must override this.

[program:livekit-server]
command=/Users/manson/ai/eidolon/eidolon_admin/deploy/supervisor/wrappers/livekit-dev.sh
    --dev
directory=/Users/manson/ai/eidolon/eidolon_admin
priority=10
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/eidolon/logs/livekit/server.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/livekit/server.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:livekit]
priority=20
programs=livekit-server
