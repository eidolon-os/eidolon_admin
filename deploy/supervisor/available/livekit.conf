; LiveKit server — shared infrastructure used by hub (room control plane) and
; channel (voice agent worker).
;
; The config file lives in eidolon_hub for historical reasons; we reference it
; in place. If you move it under this repo later, just update the --config
; path. The --dev flag uses LiveKit's permissive local-only key/secret pair —
; production deployments must override this.

[program:livekit-server]
command=/opt/homebrew/bin/livekit-server
    --config /Users/manson/ai/eidolon/eidolon_hub/deploy/dev/livekit.yaml
    --dev
directory=/Users/manson/ai/eidolon/eidolon_hub
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/eidolon/logs/livekit/server.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/livekit/server.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:livekit]
programs=livekit-server
