; NATS server with JetStream — shared infrastructure for every Eidolon
; sub-project that publishes/subscribes on the local broker (memory, hub,
; future agent). Owned by eidolon_admin's supervisord so there's exactly one
; source of truth for NATS lifecycle on this machine.
;
; Configuration values match what eidolon_hub's bundled run-nats.sh uses, so
; existing JetStream streams keep their location.

[program:nats-server]
command=/opt/homebrew/bin/nats-server
    -js
    -sd %(ENV_HOME)s/eidolon/data/nats-jetstream
    --port 4222
    --http_port 8222
directory=%(ENV_HOME)s/eidolon
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=%(ENV_HOME)s/eidolon/logs/nats/server.log
stderr_logfile=%(ENV_HOME)s/eidolon/logs/nats/server.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
environment=PYTHONUNBUFFERED="1"

[group:nats]
programs=nats-server
