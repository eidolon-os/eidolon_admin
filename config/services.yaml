# Eidolon Admin Gateway — service registry.
# Paths use $EIDOLON_ROOT (export from deploy/dev/run_all.sh or set manually).
# Bind ports come from config/ports.yaml → EIDOLON_* env vars (see app/ports.py).

admin:
  host: $EIDOLON_ADMIN_API_HOST
  port: $EIDOLON_ADMIN_API_PORT
  # Browser clients that use the control plane are explicitly allow-listed.
  cors_origins:
    - http://127.0.0.1:$EIDOLON_ADMIN_WEB_PORT
    - http://localhost:$EIDOLON_ADMIN_WEB_PORT
    - http://127.0.0.1:$EIDOLON_CLIENT_WEB_PORT
    - http://localhost:$EIDOLON_CLIENT_WEB_PORT

services:

  - id: admin
    name: Eidolon Admin
    integration: native
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_ADMIN_API_PORT/docs
    supervisor:
      config_file: deploy/supervisor/available/admin.conf
      group: admin
      programs:
        - admin-api
    ports:
      declared: [$EIDOLON_ADMIN_API_PORT, $EIDOLON_ADMIN_WEB_PORT]
    features: []
    configs:
      - id: services
        label: "services.yaml"
        path: $EIDOLON_ROOT/eidolon_admin/config/services.yaml
        format: yaml
        reload: restart_program
        reload_target: admin:admin-api

  - id: nats
    name: NATS
    integration: infra
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_NATS_HTTP_PORT/varz
    supervisor:
      config_file: deploy/supervisor/available/nats.conf
      group: nats
      programs:
        - nats-server
    ports:
      declared: [$EIDOLON_NATS_PORT, $EIDOLON_NATS_HTTP_PORT]
    features: []

  # Operational visibility only. Admin business calls do not use these static
  # URLs; the typed control-plane clients resolve endpoints through eidolond.
  - id: eidolond
    name: Eidolon System Manager
    integration: infra
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    # The isolated/product profiles expose eidolond on UDS only. Supervisor
    # process state is the operational probe; business clients use the typed
    # UDS directory adapter.
    supervisor:
      config_file: deploy/supervisor/available/eidolond.conf
      group: eidolond
      programs: [eidolond]
    ports: { declared: [] }
    features: []

  - id: data
    name: Eidolon Data V2 Authority
    integration: infra
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_DATA_API_PORT/health
    supervisor:
      config_file: deploy/supervisor/available/data.conf
      group: data
      programs: [data-api]
    ports:
      declared: [$EIDOLON_DATA_API_PORT]
    features: []

  - id: kernel
    name: Eidolon Kernel
    integration: infra
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_KERNEL_API_PORT/health
    supervisor:
      config_file: deploy/supervisor/available/kernel.conf
      group: kernel
      programs: [kernel-api]
    ports:
      declared: [$EIDOLON_KERNEL_API_PORT]
    features: []

  - id: agent
    name: Eidolon Agent
    integration: proxy
    base_url: http://127.0.0.1:$EIDOLON_AGENT_ADMIN_PORT
    upstream_prefix: /api/admin
    auth: { type: none }
    health: /api/admin/conversations/turns?limit=1
    supervisor:
      config_file: deploy/supervisor/available/agent.conf
      group: agent
      programs:
        - agent
    ports:
      declared: [$EIDOLON_AGENT_HTTP_PORT, $EIDOLON_AGENT_ADMIN_PORT, $EIDOLON_AGENT_GRPC_PORT]
    features:
      - { key: console, label: "API Console" }
    configs:
      - id: settings
        label: "agent settings.yaml"
        path: $EIDOLON_ROOT/eidolon_agent/config/settings.yaml
        format: yaml
        reload: restart_program
        reload_target: agent:agent
        template: $EIDOLON_ROOT/eidolon_agent/config/settings.example.yaml
      - id: env
        label: "agent .env"
        path: $EIDOLON_ROOT/eidolon_agent/config/.env
        format: dotenv
        reload: restart_program
        reload_target: agent:agent
        template: $EIDOLON_ROOT/eidolon_agent/config/.env.example

  - id: hub
    name: Eidolon Hub
    integration: proxy
    base_url: http://127.0.0.1:$EIDOLON_HUB_API_PORT
    upstream_prefix: ""
    # Hub management JWT belongs to the operator/client. The generic proxy
    # passes it through; the typed workflow also forwards it explicitly.
    auth: { type: passthrough }
    health: /health
    supervisor:
      config_file: deploy/supervisor/available/hub.conf
      group: hub
      programs:
        - hub-api
    ports:
      declared: [$EIDOLON_HUB_API_PORT]
    features:
      - { key: console,  label: "API Console" }
    configs:
      - id: settings
        label: "hub settings.yaml"
        path: $EIDOLON_ROOT/eidolon_hub/config/settings.yaml
        format: yaml
        reload: restart_program
        reload_target: hub:hub-api
        template: $EIDOLON_ROOT/eidolon_hub/config/settings.example.yaml
      - id: env
        label: "hub .env"
        path: $EIDOLON_ROOT/eidolon_hub/config/.env
        format: dotenv
        reload: restart_program
        reload_target: hub:hub-api
        template: $EIDOLON_ROOT/eidolon_hub/config/.env.example

  - id: memory
    name: Eidolon Memory
    integration: proxy
    base_url: http://127.0.0.1:$EIDOLON_MEMORY_SUPERVISOR_HTTP_PORT
    upstream_prefix: /api/admin
    auth: { type: none }
    health: /api/admin/health
    supervisor:
      config_file: deploy/supervisor/available/memory.conf
      group: memory
      programs:
        - memory-supervisor
        - memory-discovery
    ports:
      declared: [$EIDOLON_MEMORY_DISCOVERY_PORT, $EIDOLON_MEMORY_SUPERVISOR_HTTP_PORT]
    features:
      - { key: console, label: "API Console" }
    configs:
      - id: settings
        label: "memory settings.yaml"
        path: $EIDOLON_ROOT/eidolon_memory/config/settings.yaml
        format: yaml
        reload: restart_group
        reload_target: memory
        template: $EIDOLON_ROOT/eidolon_memory/config/settings.example.yaml
      - id: env
        label: "memory .env"
        path: $EIDOLON_ROOT/eidolon_memory/config/.env
        format: dotenv
        reload: restart_group
        reload_target: memory
        template: $EIDOLON_ROOT/eidolon_memory/config/.env.example
  - id: channel
    name: Eidolon Channel
    integration: process
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    supervisor:
      config_file: deploy/supervisor/available/channel.conf
      group: channel
      programs:
        - channel-worker
    ports:
      declared: [$EIDOLON_CHANNEL_WORKER_PORT]
    features:
      - { key: overview, label: "Overview" }
      - { key: config,   label: "Config" }
    configs:
      - id: settings
        label: "channel settings.yaml"
        path: $EIDOLON_ROOT/eidolon_channel/config/settings.yaml
        format: yaml
        reload: restart_program
        reload_target: channel:channel-worker
        template: $EIDOLON_ROOT/eidolon_channel/config/settings.example.yaml
      - id: env
        label: "channel .env"
        path: $EIDOLON_ROOT/eidolon_channel/config/.env
        format: dotenv
        reload: restart_program
        reload_target: channel:channel-worker
        template: $EIDOLON_ROOT/eidolon_channel/config/.env.example

  # Phase 31.A: Mementos (Electron-vite dev). Supervised by admin so
  # operators can start/stop it from the Supervisor UI like the rest
  # of the stack. Marked ``integration: process`` (same as channel) —
  # admin does NOT proxy the Mementos sidecar at :18765; talk to it
  # directly. health URL is informational so Supervisor's status
  # column has something to render.
  #
  # ``optional: true`` (Phase 32+) — mementos is a side project that
  # operators sometimes run as a standalone Electron app outside the
  # dev stack (开发它本身的时候). Pre-flight port audit treats a
  # busy :18765 as "fine, just won't supervise" instead of refusing
  # the whole cold start.
  - id: mementos
    name: Mementos
    integration: process
    optional: true
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_MEMENTOS_PORT/health
    supervisor:
      config_file: deploy/supervisor/available/mementos.conf
      group: mementos
      programs:
        - mementos
    ports:
      declared: [$EIDOLON_MEMENTOS_PORT]
    features: []

  - id: client-web
    name: Eidolon Client Web
    integration: process
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_CLIENT_WEB_PORT/
    supervisor:
      config_file: deploy/supervisor/available/client-web.conf
      group: client-web
      programs:
        - client-web
    ports:
      declared: [$EIDOLON_CLIENT_WEB_PORT]
    features:
      - { key: overview, label: "Overview" }
      - { key: config,   label: "Config" }
    configs:
      - id: env-local
        label: ".env.local"
        path: $EIDOLON_ROOT/eidolon_client_web/.env.local
        format: dotenv
        reload: restart_program
        reload_target: client-web:client-web
        template: $EIDOLON_ROOT/eidolon_client_web/.env.local.example
