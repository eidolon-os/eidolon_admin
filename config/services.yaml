# Eidolon Admin Gateway — service registry.
# Paths use $EIDOLON_ROOT (export from deploy/dev/run_all.sh or set manually).
# Bind ports come from config/ports.yaml → EIDOLON_* env vars (see app/ports.py).

admin:
  host: $EIDOLON_ADMIN_API_HOST
  port: $EIDOLON_ADMIN_API_PORT
  cors_origins:
    - http://127.0.0.1:$EIDOLON_ADMIN_WEB_PORT
    - http://localhost:$EIDOLON_ADMIN_WEB_PORT

services:

  - id: admin
    name: Eidolon Admin
    integration: native
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_ADMIN_API_PORT/docs
    supervisor:
      config_file: deploy/supervisor/available/admin.conf
      group: admin
      programs:
        - admin-api
    ports:
      declared: [$EIDOLON_ADMIN_API_PORT, $EIDOLON_ADMIN_WEB_PORT]
    features: []
    configs:
      - id: services
        label: "services.yaml"
        path: $EIDOLON_ROOT/eidolon_admin/config/services.yaml
        format: yaml
        reload: restart_program
        reload_target: admin:admin-api

  - id: agent
    name: Eidolon Agent
    integration: proxy
    base_url: http://127.0.0.1:$EIDOLON_AGENT_ADMIN_PORT
    upstream_prefix: /api/admin
    auth: { type: none }
    health: /api/admin/personas/templates
    supervisor:
      config_file: deploy/supervisor/available/agent.conf
      group: agent
      programs:
        - agent
    ports:
      declared: [$EIDOLON_AGENT_HTTP_PORT, $EIDOLON_AGENT_ADMIN_PORT, $EIDOLON_AGENT_GRPC_PORT]
    features:
      - { key: personas-templates, label: "Persona 模板" }
      - { key: personas-instances, label: "Persona 实例" }
      - { key: persona-lab,        label: "Persona Lab" }
      - { key: devices,            label: "Devices" }
      - { key: pairing,            label: "Pairing" }
      - { key: chat-stream,        label: "Chat", stream: true }
      - { key: chat-test,          label: "Chat (events)", stream: true }
      - { key: console,            label: "API Console" }
    configs:
      - id: settings
        label: "agent settings.yaml"
        path: $EIDOLON_ROOT/eidolon_agent/config/settings.yaml
        format: yaml
        reload: restart_program
        reload_target: agent:agent
        template: $EIDOLON_ROOT/eidolon_agent/config/settings.example.yaml
      - id: env
        label: "agent .env"
        path: $EIDOLON_ROOT/eidolon_agent/config/.env
        format: dotenv
        reload: restart_program
        reload_target: agent:agent
        template: $EIDOLON_ROOT/eidolon_agent/config/.env.example

  - id: hub
    name: Eidolon Hub
    integration: proxy
    base_url: http://127.0.0.1:$EIDOLON_HUB_API_PORT
    upstream_prefix: /api/admin
    auth: { type: none }
    health: /api/admin/probe/health
    supervisor:
      config_file: deploy/supervisor/available/hub.conf
      group: hub
      programs:
        - hub-api
    ports:
      declared: [$EIDOLON_HUB_API_PORT]
    features:
      - { key: devices,  label: "Devices" }
      - { key: commands, label: "Commands" }
      - { key: events,   label: "Events", stream: true }
      - { key: metrics,  label: "Metrics" }
      - { key: console,  label: "API Console" }
    configs:
      - id: settings
        label: "hub settings.yaml"
        path: $EIDOLON_ROOT/eidolon_hub/config/settings.yaml
        format: yaml
        reload: restart_program
        reload_target: hub:hub-api
        template: $EIDOLON_ROOT/eidolon_hub/config/settings.example.yaml
      - id: env
        label: "hub .env"
        path: $EIDOLON_ROOT/eidolon_hub/config/.env
        format: dotenv
        reload: restart_program
        reload_target: hub:hub-api
        template: $EIDOLON_ROOT/eidolon_hub/config/.env.example

  - id: memory
    name: Eidolon Memory
    integration: native
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_MEMORY_DISCOVERY_PORT/api/discovery/agent-routing
    supervisor:
      config_file: deploy/supervisor/available/memory.conf
      group: memory
      programs:
        - memory-supervisor
        - memory-discovery
    ports:
      declared: [$EIDOLON_MEMORY_DISCOVERY_PORT]
    features:
      - { key: runners,   label: "Runners & Workers" }
      - { key: users,     label: "Users" }
      - { key: memories,  label: "Memories" }
      - { key: search,    label: "Search" }
      - { key: write,     label: "Write Turn" }
      - { key: recall,    label: "Recall" }
      - { key: hierarchy, label: "Hierarchy" }
      - { key: graph,     label: "Graph" }
      - { key: kg,        label: "Knowledge Graph" }
      - { key: mcp,       label: "MCP Tools" }
    configs:
      - id: settings
        label: "memory settings.yaml"
        path: $EIDOLON_ROOT/eidolon_memory/config/settings.yaml
        format: yaml
        reload: restart_group
        reload_target: memory
        template: $EIDOLON_ROOT/eidolon_memory/config/settings.example.yaml
      - id: env
        label: "memory .env"
        path: $EIDOLON_ROOT/eidolon_memory/config/.env
        format: dotenv
        reload: restart_group
        reload_target: memory
        template: $EIDOLON_ROOT/eidolon_memory/config/.env.example
      - id: users
        label: "users.yaml"
        path: $EIDOLON_ROOT/eidolon_memory/config/users.yaml
        format: yaml
        reload: sighup_program
        reload_target: memory:memory-supervisor

  - id: channel
    name: Eidolon Channel
    integration: process
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    supervisor:
      config_file: deploy/supervisor/available/channel.conf
      group: channel
      programs:
        - channel-worker
    ports:
      declared: [$EIDOLON_CHANNEL_WORKER_PORT]
    features:
      - { key: overview, label: "Overview" }
      - { key: config,   label: "Config" }
    configs:
      - id: settings
        label: "channel settings.yaml"
        path: $EIDOLON_ROOT/eidolon_channel/config/settings.yaml
        format: yaml
        reload: restart_program
        reload_target: channel:channel-worker
        template: $EIDOLON_ROOT/eidolon_channel/config/settings.example.yaml
      - id: env
        label: "channel .env"
        path: $EIDOLON_ROOT/eidolon_channel/config/.env
        format: dotenv
        reload: restart_program
        reload_target: channel:channel-worker
        template: $EIDOLON_ROOT/eidolon_channel/config/.env.example

  - id: client-web
    name: Eidolon Client Web
    integration: process
    base_url: ""
    upstream_prefix: ""
    auth: { type: none }
    health: http://127.0.0.1:$EIDOLON_CLIENT_WEB_PORT/
    supervisor:
      config_file: deploy/supervisor/available/client-web.conf
      group: client-web
      programs:
        - client-web
    ports:
      declared: [$EIDOLON_CLIENT_WEB_PORT]
    features:
      - { key: overview, label: "Overview" }
      - { key: config,   label: "Config" }
    configs:
      - id: env-local
        label: ".env.local"
        path: $EIDOLON_ROOT/eidolon_client_web/.env.local
        format: dotenv
        reload: restart_program
        reload_target: client-web:client-web
        template: $EIDOLON_ROOT/eidolon_client_web/.env.local.example
