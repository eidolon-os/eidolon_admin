<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -18 160 160" width="160" height="160">
  <defs>
    <radialGradient id="ncore" cx="0.4" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.3" stop-color="#FFC2E0"/>
      <stop offset="0.65" stop-color="#FF3A90"/>
      <stop offset="1" stop-color="#B01464"/>
    </radialGradient>
    <radialGradient id="nbloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF3A90" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#FF2E88" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FF2E88" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nviolet" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#A44BFF" stop-opacity="0.4"/>
      <stop offset="0.6" stop-color="#7A3BE0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7A3BE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nspec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="b06" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="0.7"/></filter>
    <filter id="b4" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="b11" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="11"/></filter>
  </defs>

  <!-- interior violet field: the bridge tone where cyan shell meets magenta core -->
  <circle cx="60" cy="60" r="40" fill="url(#nviolet)"/>

  <!-- hexagon vessel: four-layer neon tube, soft to white-hot -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M72.12 33 L94.64 46 L94.64 86 L60 106 L25.36 86 L25.36 46 L47.88 33"
          stroke="#00D4FF" stroke-width="11.5" opacity="0.45" filter="url(#b11)"/>
    <path d="M72.12 33 L94.64 46 L94.64 86 L60 106 L25.36 86 L25.36 46 L47.88 33"
          stroke="#00EAFF" stroke-width="7" opacity="0.9" filter="url(#b4)"/>
    <path d="M72.12 33 L94.64 46 L94.64 86 L60 106 L25.36 86 L25.36 46 L47.88 33"
          stroke="#5CF3FF" stroke-width="5" filter="url(#b06)"/>
    <path d="M72.12 33 L94.64 46 L94.64 86 L60 106 L25.36 86 L25.36 46 L47.88 33"
          stroke="#E6FEFF" stroke-width="2.3"/>
  </g>

  <!-- plasma core: the single blazing element -->
  <circle cx="60" cy="50" r="30" fill="url(#nbloom)"/>
  <circle cx="60" cy="50" r="13" fill="#FF2E88" opacity="0.85" filter="url(#b4)"/>
  <circle cx="60" cy="50" r="10.5" fill="url(#ncore)"/>
  <ellipse cx="56" cy="45.5" rx="4.2" ry="3.2" fill="url(#nspec)" filter="url(#b06)"/>
</svg>
