[project]
name = "eidolon-admin"
version = "0.1.0"
description = "Unified admin gateway for Eidolon sub-projects (agent / hub / memory)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "supervisor>=4.2.5",
    "psutil>=6.0",
    "mcp>=1.2.0",
    "nats-py>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]
# To enable the cross-repo in-process fullstack test
# (server/tests/test_devices_fullstack.py), editable-install the sibling
# repos into this venv:
#     pip install -e ../eidolon_hub -e ../eidolon_agent
# These are NOT declared as deps here because PEP 508 doesn't have a
# portable relative-path syntax and we don't want every dev to need
# both sibling repos checked out. Without them, the fullstack test file
# skips cleanly via importlib.util.find_spec at module load.

[project.scripts]
eidolon-admin = "eidolon_admin_server.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
