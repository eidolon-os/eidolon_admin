[project]
name = "eidolon-admin"
version = "0.1.0"
description = "Eidolon OS control-plane gateway and bounded-context orchestrator"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "supervisor>=4.2.5",
    "psutil>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "jsonschema>=4.23",
]

[project.scripts]
eidolon-admin = "eidolon_admin_server.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]
markers = [
    "unit: pure application/domain behavior",
    "component: Admin ASGI behavior with controlled authority transports",
    "contract: consumed producer contract verification",
    "integration: several real ASGI applications or process boundaries",
    "e2e: real Admin and producer processes over isolated loopback ports",
]

[tool.coverage.run]
branch = true
source = ["eidolon_admin_server"]

[tool.coverage.report]
show_missing = true
skip_covered = true
